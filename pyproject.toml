[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-protection"
version = "0.1.0"
description = "Authorized AI application security evaluation and remediation assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.2",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

